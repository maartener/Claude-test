<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Ascot 2026 — Inzetsstrategie</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-logo">👑</div>
      <h1 class="header-title">Royal Ascot 2026</h1>
      <p class="header-subtitle">Inzetsstrategie · Zaterdag 20 juni</p>
      <div class="budget-banner">
        <div class="budget-item">
          <span class="budget-label">Max per race</span>
          <span class="budget-value">£200</span>
        </div>
        <div class="budget-divider">|</div>
        <div class="budget-item">
          <span class="budget-label">Totaal ingezet</span>
          <span class="budget-value">£<span id="total-amount">0</span></span>
        </div>
        <div class="budget-divider">|</div>
        <div class="budget-item">
          <span class="budget-label">Best case WIN</span>
          <span class="budget-value">£<span id="return-amount">0</span></span>
        </div>
      </div>
    </div>
  </header>

  <main class="main container" id="races-container"></main>

  <section class="day-summary" id="day-summary"></section>

  <footer class="site-footer">
    <div class="container">
      <p>⚠️ Gok verantwoord. 18+. Verlies nooit meer dan je je kunt veroorloven.</p>
      <p><a href="https://www.begambleaware.org" target="_blank">BeGambleAware.org</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
