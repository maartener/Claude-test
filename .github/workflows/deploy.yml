name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        run: |
          mkdir -p /tmp/site
          cp index.html styles.css script.js /tmp/site/
          cd /tmp/site
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/maartener/Claude-test.git HEAD:gh-pages
